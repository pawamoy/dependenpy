<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title description">
<title id="title">Dependenpy dependency scan</title>
<desc id="description">Scan a Python package from the command line and generate dependency counts with the Scan class.</desc>
<rect width="1000" height="450" rx="12" fill="#282d35"/>
<g fill="#b9bfca" font-family="DejaVu Sans Mono, monospace" font-size="20">
<text x="30" y="55" fill="#71bef2" xml:space="preserve">$ dependenpy tests/fixtures/internal -z=</text>
<text x="30" y="85" fill="#b9bfca" xml:space="preserve"></text>
<text x="30" y="115" fill="#b9bfca" xml:space="preserve">                Module │ Id │0│1│2│</text>
<text x="30" y="145" fill="#b9bfca" xml:space="preserve"> ──────────────────────┼────┼─┼─┼─┤</text>
<text x="30" y="175" fill="#b9bfca" xml:space="preserve">     internal.__init__ │  0 │1│ │ │</text>
<text x="30" y="205" fill="#b9bfca" xml:space="preserve">     internal.module_a │  1 │1│ │2│</text>
<text x="30" y="235" fill="#b9bfca" xml:space="preserve"> internal.subpackage_a │  2 │ │1│3│</text>
<text x="30" y="265" fill="#b9bfca" xml:space="preserve"></text>
<text x="30" y="295" fill="#71bef2" xml:space="preserve">&gt;&gt;&gt; from dependenpy import Scan</text>
<text x="30" y="325" fill="#71bef2" xml:space="preserve">&gt;&gt;&gt; scan = Scan(&quot;tests/fixtures/internal&quot;)</text>
<text x="30" y="355" fill="#71bef2" xml:space="preserve">&gt;&gt;&gt; scan.as_matrix(depth=2).total</text>
<text x="30" y="385" fill="#b9bfca" xml:space="preserve">8</text>
</g>
</svg>
